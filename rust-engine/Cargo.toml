[package]
name = "rust-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
chrono = "0.4.44"
crossbeam = "0.8.4"
dashmap = "6.1.0"
env_logger = "0.11.10"
futures = "0.3.32"
futures-util = "0.3.32"
log = "0.4.29"
parking_lot = "0.12.5"
rand = "0.10.1"
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
structopt = "0.3.26"
tokio = { version = "1.51.1", features = ["full"] }
tokio-tungstenite = "0.29.0"
tower-http = { version = "0.6.8", features = ["cors"] }
tungstenite = "0.29.0"
